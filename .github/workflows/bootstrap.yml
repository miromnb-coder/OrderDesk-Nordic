name: Bootstrap site

permissions:
  contents: write

on:
  push:
    branches: [main]

jobs:
  bootstrap:
    if: ${{ github.actor != 'github-actions[bot]' && hashFiles('.bootstrap/chunk-00') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Materialize project
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* > /tmp/orderdesk.b64
          test "$(wc -c < /tmp/orderdesk.b64)" -eq 20592
          base64 --decode /tmp/orderdesk.b64 > /tmp/orderdesk.tgz
          tar -xzf /tmp/orderdesk.tgz
          rm -rf .bootstrap
          rm -f .github/workflows/qa.yml

      - name: Commit site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: build OrderDesk marketing site"
          git push
